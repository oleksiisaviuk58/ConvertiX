<!DOCTYPE html>
<html lang="en">

<head>
   <title>ConvertiX</title>
   <link rel="stylesheet" href="css/style.css">
   <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
</head>

<body>
   <div class="block">
      <form action="">
         <h1>Конвертер валют</h1>
         <p>Введіть суму та виберіть напрямок конвертації</p>

         <input class="from_input" type="text" placeholder="З якої валюти">
         <input class="to_input" type="text" placeholder="В яку валюту">

         <div class="result">
            <p>Результат:</p>
            <input class="result_input" type="text" readonly placeholder="Тут буде результат">
         </div>

         <div class="actions">
            <button class="send_button">Конвертувати</button>
            <button class="reset_button">Скинути</button>
         </div>
      </form>
   </div>
</body>

</html>
